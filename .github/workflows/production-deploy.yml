name: Production deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full validated protected-main commit SHA
        required: true
      rollback:
        description: Redeploy a commit confirmed in GitHub Pages production history
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://fu-l.github.io/abc-textbook/
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      SITE_URL: https://fu-l.github.io
      BASE_PATH: /abc-textbook
      ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Enforce main membership and all required successful checks
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${#RELEASE_COMMIT}" = 40
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs?per_page=100" --jq '.check_runs[] | {name, conclusion, status}' > /tmp/check-runs.jsonl
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const required = ['Verify (release baseline)', 'Verify (supported range)', 'Initial corpus audit', 'Release validation', 'Production review'];
          const checks = fs.readFileSync('/tmp/check-runs.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          for (const name of required) {
            const check = checks.find(check => check.name === name);
            if (check?.status !== 'completed' || check.conclusion !== 'success') throw Error(`Required check not successful: ${name}`);
          }
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Read-only exact-commit final validation
        run: GITHUB_SHA="$RELEASE_COMMIT" npm run verify:release -- --commit "$RELEASE_COMMIT"
      - name: Generate metadata or recover the known published metadata
        id: metadata
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { release } = JSON.parse(fs.readFileSync('docs/verification/releases/catalog.json'));
          let metadata;
          if (process.env.ROLLBACK === 'true') {
            const status = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/pages/deployments/${process.env.RELEASE_COMMIT}`]));
            if (status.status !== 'succeed') throw Error('Unknown published rollback commit');
            const response = await fetch(`${process.env.SITE_URL}${process.env.BASE_PATH}/release-metadata.json`);
            const live = response.ok ? await response.json() : null;
            if (live?.commit === process.env.RELEASE_COMMIT) metadata = live;
            else metadata = JSON.parse(execFileSync('git', ['show', 'origin/main:docs/verification/deployments/initial-release.json'])).releaseMetadata;
            if (metadata?.commit !== process.env.RELEASE_COMMIT) throw Error('Published rollback metadata missing');
          } else {
            metadata = { schemaVersion: '1.0.0', version: release.version, cutoffAt: release.cutoffAt,
              commit: process.env.RELEASE_COMMIT,
              validationResultsUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              changeSummary: { updateIds: release.updateIds, addedProblemIds: release.addedProblemIds,
                changedProblemIds: release.changedProblemIds, withdrawnProblemIds: release.withdrawnProblemIds,
                taxonomyChanges: release.taxonomyChanges.map(change => change.summary) } };
          }
          fs.writeFileSync('/tmp/release-metadata.json', JSON.stringify(metadata, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release-kind=${release.releaseKind}\n`);
          JS
      - name: Build locked exact tree and check internal links
        run: |
          npm run build
          npm run link:check:built
          cp /tmp/release-metadata.json dist/release-metadata.json
          touch dist/.nojekyll
      - name: Upload exact static build
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy the artifact with its exact Git build version
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const fs = require('node:fs');
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: Number(process.env.PAGES_ARTIFACT_ID),
              pages_build_version: process.env.RELEASE_COMMIT, oidc_token: await core.getIDToken()
            });
            if (deployment.id !== process.env.RELEASE_COMMIT) throw Error('Pages build version mismatch');
            for (let attempt = 0; attempt < 120; attempt += 1) {
              const { data: status } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo, pages_deployment_id: deployment.id
              });
              if (status.status === 'succeed') {
                fs.writeFileSync('/tmp/pages-deployment.json', JSON.stringify({ ...deployment, ...status, commit: process.env.RELEASE_COMMIT, workflowRunId: context.runId, workflowCommit: context.sha, observedAt: new Date().toISOString() }));
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status.status)) throw Error(`Pages deployment failed: ${status.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw Error('Pages deployment timed out');
      - name: Install browsers for initial live verification
        if: ${{ steps.metadata.outputs.release-kind == 'initial' }}
        run: npm run test:e2e:install:ci
      - name: Verify live routes, search and learning-record compatibility
        if: ${{ steps.metadata.outputs.release-kind == 'initial' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 docs/operations/verify-initial-deployment.py --commit "$RELEASE_COMMIT" --output
          /tmp/initial-production-verified/initial-release.json
      - name: Preserve actual host verification and immutable Git history
        if: ${{ steps.metadata.outputs.release-kind == 'initial' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: initial-production-verification-${{ inputs.commit }}
          path: /tmp/initial-production-verified/
          if-no-files-found: error
