name: Initial release audit evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Initial corpus audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select npm 11.21.1
        run: npm install --global npm@11.21.1
      - name: Verify runtime versions
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = 11.21.1
      - run: npm ci
      - name: Validate nonpublic documentation changes
        id: docs
        uses: ./.github/actions/nonpublic-docs
      - name: Verify production verification fixtures
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 docs/operations/test_verify_initial_deployment.py
      - name: Reject stale or incomplete initial corpus audit evidence
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run: npm run verify:initial-release -- --check
