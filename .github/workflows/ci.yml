name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release baseline
            node-version: '24.18.0'
            npm-version: '11.16.0'
          - name: supported range
            node-version: '24.x'
            npm-version: '11.17.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select npm ${{ matrix.npm-version }}
        run: npm install --global "npm@${{ matrix.npm-version }}"

      - name: Verify runtime versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Check textbook mathematical regressions
        run: |
          python3 docs/verification/bootstrap/pr65-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review2-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review3-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review4-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review5-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review6-mathematical-checks.py

      - name: Install Playwright browsers
        run: npm run test:e2e:install:ci

      - name: Run full verification
        run: npm run verify:fast
