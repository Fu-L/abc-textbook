name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (release baseline)
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://fu-l.github.io
      BASE_PATH: /abc-textbook
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Select npm 11.16.0
        run: npm install --global npm@11.16.0
      - name: Verify runtime versions
        run: |
          test "$(node --version)" = v24.18.0
          test "$(npm --version)" = 11.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify documentation checker
        run: node --test .github/actions/nonpublic-docs/check.test.mjs
      - name: Verify changed scope
        run: npm run verify:fast
