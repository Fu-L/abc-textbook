name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release baseline
            node-version: '24.18.0'
            npm-version: '11.16.0'
          - name: supported range
            node-version: '24.x'
            npm-version: '11.17.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select npm ${{ matrix.npm-version }}
        run: npm install --global "npm@${{ matrix.npm-version }}"

      - name: Verify runtime versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Validate nonpublic documentation changes
        id: docs
        uses: ./.github/actions/nonpublic-docs

      - name: Check textbook mathematical regressions
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run: |
          python3 docs/verification/bootstrap/pr65-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review2-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review3-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review4-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review5-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review6-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review7-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review8-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review9-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review10-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review11-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review12-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review13-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review14-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review15-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review16-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review17-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review18-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review19-mathematical-checks.py
          python3 docs/verification/bootstrap/pr65-review20-mathematical-checks.py

      - name: Install Playwright browsers
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run: npm run test:e2e:install:ci

      - name: Run full verification
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run: npm run verify:fast

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Validate nonpublic documentation changes
        id: docs
        uses: ./.github/actions/nonpublic-docs
      - name: Validate update and release implementation
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run: >-
          npm test -- tests/integration/release-commit.test.ts
          tests/integration/canonical-correction.test.ts
          tests/integration/git-deployment-adapter.test.ts tests/integration/update-prepare.test.ts
          tests/integration/update-validation.test.ts tests/unit/release-history.test.ts
          tests/unit/release-learning-structure.test.ts tests/unit/evidence-inventory.test.ts
          tests/unit/trusted-diff.test.ts tests/unit/human-content-review.test.ts
      - name: Validate exact release tree when a full catalog is supplied
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        shell: bash
        run: |
          if test -f docs/verification/releases/catalog.json; then
            if node -e 'const c=JSON.parse(require("fs").readFileSync("docs/verification/releases/catalog.json"));process.exit(c.release.humanContentReviewEvidenceRefs.length || c.release.agentQualityReviewEvidenceRef ? 1 : 0)'; then
              node --import tsx scripts/verify-release.ts --commit "$GITHUB_SHA" --preparation > /tmp/final-validation.json
            else
              node --import tsx scripts/verify-release.ts --commit "$GITHUB_SHA" > /tmp/final-validation.json
            fi
            cat /tmp/final-validation.json
          else
            echo 'Implementation checks passed; no production release catalog has been supplied. The prepared T160 projection is verified separately and does not authorize production publication.'
          fi
      - name: Preserve exact-commit validation result
        if: ${{ always() && steps.docs.outputs.docs-only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-validation-${{ github.sha }}
          path: /tmp/final-validation.json
          if-no-files-found: ignore

  production-review:
    name: Production review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Validate nonpublic documentation changes
        id: docs
        uses: ./.github/actions/nonpublic-docs
      - name: Require current-subject policy-selected review of the exact release
        if: ${{ steps.docs.outputs.docs-only != 'true' }}
        run:
          node --import tsx scripts/verify-release.ts --commit "$GITHUB_SHA" >
          /tmp/production-review.json
      - name: Preserve production gate result
        if: ${{ always() && steps.docs.outputs.docs-only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-review-${{ github.sha }}
          path: /tmp/production-review.json
          if-no-files-found: ignore
